              const auto itemHeight = view->height();
              const auto stepY = std::max(8, itemHeight / 12);
              const auto stepX = std::max(16, width() / 8);
              for (auto y = top + 4; y < top + itemHeight; y += stepY) {
                  for (auto x = 4; x < width(); x += stepX) {
