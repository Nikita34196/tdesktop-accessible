          )
          if marker not in cpp:
              print('ERROR: a11yCollectFocusedLinks scan landmark not found')
              exit(1)

          cpp = cpp.replace(marker, insert, 1)
          with open(cpp_path, 'w', encoding='utf-8') as f:
              f.write(cpp)
          print('history_inner_widget.cpp: forward-header link scan added')

      # ============================================
      # 7j. Chat list context menu (Shift+F10 / Menu key).
      #
      # Upstream showPeerMenu() and contextMenuEvent() require _selected.
      # NVDA can focus a list child via MSAA without updating _selected,
      # so Shift+F10 becomes a no-op. Sync from QAccessible::focusChild()
      # before opening the menu; also handle the keys in keyPressEvent.
      # ============================================
      - name: Patch Dialogs chat list context menu for keyboard
        shell: python
        run: |
          import os, re

          cpp = 'tdesktop/Telegram/SourceFiles/dialogs/dialogs_inner_widget.cpp'
          h = 'tdesktop/Telegram/SourceFiles/dialogs/dialogs_inner_widget.h'
          for p in (cpp, h):
              if not os.path.exists(p):
                  print(f'WARNING: missing {p} — skipping chat menu patch')
                  exit(0)

          with open(cpp, 'r', encoding='utf-8') as f:
              src = f.read()

          if 'a11y-sync-selected-for-context-menu' in src:
              print('dialogs_inner_widget.cpp chat menu patch already applied')
              exit(0)

          if 'QAccessible' not in src:
              src, n_inc = re.subn(
                  r'(#include\s+"ui/screen_reader_mode\.h"\s*\n)',
                  lambda m: m.group(1) + '#include <QAccessible>\n',
                  src,
                  count=1)
              if n_inc == 0:
                  src, n_inc = re.subn(
                      r'(#include\s+"dialogs/dialogs_inner_widget\.h"\s*\n)',
                      lambda m: m.group(1) + '#include <QAccessible>\n',
                      src,
                      count=1)
                  if n_inc == 0:
                      print('ERROR: cannot insert QAccessible include')
                      exit(1)

          sync_fn = r'''
          // a11y-sync-selected-for-context-menu: map MSAA-focused row
          // to Telegram's _selected before keyboard context menu opens.
          bool InnerWidget::a11ySyncSelectedFromFocusChild() {
          	if (_selected || _state != WidgetState::Default) {
          		return (_selected != nullptr);
          	}
          	auto *iface = QAccessible::queryAccessibleInterface(this);
          	if (!iface) {
          		return false;
          	}
          	auto *child = iface->focusChild();
          	if (!child) {
          		return false;
          	}
          	const auto index = iface->indexOfChild(child);
          	if (index < 0 || index >= accessibilityChildCount()) {
          		return false;
          	}
          	if (!_shownList || index >= int(_shownList->size())) {
          		return false;
          	}
          	_selected = (_shownList->cbegin() + index)->get();
          	return (_selected != nullptr);
          }

          '''

          show_pattern = re.compile(
              r'void\s+InnerWidget::showPeerMenu\s*\(\s*\)\s*\{\s*\n'
              r'\tif\s*\(\s*!_selected\s*\)\s*\{\s*\n'
              r'\t\treturn;\s*\n'
              r'\t\}')
          show_replacement = (
              'void InnerWidget::showPeerMenu() {\n'
              '\ta11ySyncSelectedFromFocusChild();\n'
              '\tif (!_selected) {\n'
              '\t\treturn;\n'
              '\t}'
          )
          src2, n_show = show_pattern.subn(show_replacement, src, count=1)
          if n_show == 0:
              print('ERROR: showPeerMenu() landmark not found')
              exit(1)

          ctx_pattern = re.compile(
              r'(void\s+InnerWidget::contextMenuEvent\s*\(\s*QContextMenuEvent\s*\*e\s*\)\s*\{\s*\n'
              r'\t_menu\s*=\s*nullptr;\s*\n'
              r'\n'
              r'\tconst\s+auto\s+fromMouse\s*=\s*e->reason\(\)\s*==\s*QContextMenuEvent::Mouse;\s*\n)'
          ctx_replacement = (
              r'\1'
              '\n'
              '\tif (!fromMouse) {\n'
              '\t\ta11ySyncSelectedFromFocusChild();\n'
              '\t}\n'
          )
          src2, n_ctx = ctx_pattern.subn(ctx_replacement, src2, count=1)
          if n_ctx == 0:
              print('ERROR: contextMenuEvent() landmark not found')
              exit(1)

          key_pattern = re.compile(
              r'(void\s+InnerWidget::keyPressEvent\s*\(\s*QKeyEvent\s*\*e\s*\)\s*\{\s*\n'
              r'\tif\s*\(\s*processKeyDispatch\s*\(\s*e\s*\)\s*\)\s*\{\s*\n'
              r'\t\treturn;\s*\n'
              r'\t\}\s+else\s+if\s*\(\s*e->key\(\)\s*==\s*Qt::Key_Return)'
          key_replacement = (
              'void InnerWidget::keyPressEvent(QKeyEvent *e) {\n'
              '\tif (processKeyDispatch(e)) {\n'
              '\t\treturn;\n'
              '\t} else if ((e->key() == Qt::Key_F10\n'
              '\t\t\t&& (e->modifiers() & Qt::ShiftModifier))\n'
              '\t\t\t|| e->key() == Qt::Key_Menu) {\n'
              '\t\ta11ySyncSelectedFromFocusChild();\n'
              '\t\tshowPeerMenu();\n'
              '\t\treturn;\n'
              '\t} else if (e->key() == Qt::Key_Return'
          )
          src2, n_key = key_pattern.subn(key_replacement, src2, count=1)
          if n_key == 0:
              print('ERROR: keyPressEvent() landmark not found')
              exit(1)

          if 'a11ySyncSelectedFromFocusChild' not in src2:
              src2 = src2.replace(
                  'void InnerWidget::showPeerMenu() {',
                  sync_fn + 'void InnerWidget::showPeerMenu() {',
                  1)

          with open(h, 'r', encoding='utf-8') as f:
              hdr = f.read()
          if 'a11ySyncSelectedFromFocusChild' not in hdr:
              hdr, n_decl = re.subn(
                  r'(void\s+showPeerMenu\s*\(\s*\)\s*;)',
                  r'\1\n\tbool a11ySyncSelectedFromFocusChild();',
                  hdr,
                  count=1)
              if n_decl == 0:
                  print('ERROR: showPeerMenu declaration not found in .h')
                  exit(1)
              with open(h, 'w', encoding='utf-8') as f:
                  f.write(hdr)

          with open(cpp, 'w', encoding='utf-8') as f:
              f.write(src2)
          print('dialogs_inner_widget.cpp: chat list context menu patched')

      # ============================================
      # 8. Cache third-party libraries
      # ============================================
      - name: Generate cache key
        shell: bash
        run: |
          PREPARE_FILE="$REPO_NAME/Telegram/build/prepare/prepare.py"
          if [ -f "$PREPARE_FILE" ]; then
            echo "CACHE_KEY=$(sha256sum $PREPARE_FILE | awk '{ print $1 }')" >> $GITHUB_ENV
          else
            echo "CACHE_KEY=no-prepare-file" >> $GITHUB_ENV
          fi

      - name: Restore libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          # ThirdParty must be cached too: prepare.py installs the
          # bundled Python interpreter there (ThirdParty/python/Scripts/
          # python), and tdesktop/CMakeLists.txt hard-codes that path
          # as Python3_EXECUTABLE on Windows. Caching only Libraries
          # makes a cache hit skip prepare.py and then CMake fails to
          # find Python.
          path: |
            Libraries
            ThirdParty
          # v2 prefix busts the old Libraries-only cache.
          key: win-x64-libs-v2-${{ env.CACHE_KEY }}

      # ============================================
      # 9. Prepare libraries (if not cached)
      # ============================================
      - name: Prepare libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd %REPO_NAME%
          python Telegram\build\prepare\prepare.py

      # ============================================
      # 9b. Free disk space on the runner.
      #
      # Telegram + Qt + all the bundled libraries produce ~25-30 GB of
      # intermediate .obj / .pdb / .pch files. windows-latest images have
      # ~14 GB free out of the box, so the link step eventually trips
      #   error C1090: PDB API call failed, error code '12'
      # which is MSVC's polite phrasing for "ran out of disk during PDB
      # generation". (Reproduced in builds 69732383083 / 69732394719,
      # both died at link time after ~3.5h of compile work.)
      #
      # Strip the pre-installed SDKs/toolchains we don't need to reclaim
      # ~30 GB before the build. This is the standard fix and is what
      # other Telegram-derived workflows do.
      # ============================================
      - name: Free disk space
        shell: pwsh
        run: |
          Write-Host "Before cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-List
          $paths = @(
            'C:\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\Android',
            'C:\ghcup',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk',
            'C:\Program Files\Java',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files (x86)\Microsoft SQL Server',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\WiX Toolset v3.14',
            'C:\Program Files\dotnet',
            'C:\Program Files (x86)\dotnet',
            'C:\SeleniumWebDrivers',
            'C:\tools\php',
            'C:\Strawberry'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p ..."
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $p
            }
          }
          Write-Host "After cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-List

      # ============================================
      # 9c. Set up sccache — caches MSVC .obj files keyed on source +
      # flags hash. Build-output cache survives across runs via GitHub
      # Actions cache; subsequent builds with unchanged Telegram source
      # become a near-no-op for compilation.
      #
      # Requires /Z7 (embedded debug info, no shared PDB) — handled in
      # the Configure step below. With /Zi sccache cannot cache because
      # multiple .obj files share a single PDB.
      # ============================================
      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          max-size: 2G
          key: tdesktop-msvc-${{ env.CACHE_KEY }}
          restore-keys: |
            tdesktop-msvc-

      # ============================================
      # 10. Configure
      #
      # Switched to Ninja Multi-Config generator. Three reasons all the
      # previous attempts hit walls:
      #   1. CMAKE_<LANG>_COMPILER_LAUNCHER (= sccache) is silently
      #      ignored by CMake's Visual Studio generator — sccache stats
      #      from f1f3183's build showed `Compile requests: 0`. Ninja
      #      honors the launcher correctly so sccache actually caches.
      #   2. No more mspdbsrv shared PDB on /Zi (we kept /Z7 anyway)
      #      so there's no need for /FS or --parallel caps.
      #   3. Ninja's dependency graph is finer-grained than MSBuild;
      #      incremental rebuilds touch fewer TUs.
      #
      # run_cmake.py in cmake_helpers rejects the `x64` token when an
      # explicit `-G` is passed ("x86/x64/arm switch is supported only
      # with Visual Studio"). We drop the x64 arg — msvc-dev-cmd@v1
      # already sourced vcvars64.bat so cl.exe / link.exe in PATH are
      # the x64 toolchain.
      #
      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded + CMP0141 NEW
      # asks CMake to emit /Z7 (debug info embedded in each .obj)
      # instead of the default /Zi (shared vc140.pdb). With /Z7 plus
      # Ninja's per-file build, sccache can cache .obj outputs.
      # ============================================
      - name: Configure
        shell: cmd
        run: |
          cd %REPO_NAME%\Telegram
          call configure.bat ^
              -G "Ninja Multi-Config" ^
              -D TDESKTOP_API_ID=${{ secrets.API_ID }} ^
              -D TDESKTOP_API_HASH=${{ secrets.API_HASH }} ^
              -D CMAKE_POLICY_DEFAULT_CMP0141=NEW ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
              -D CMAKE_CXX_COMPILER_LAUNCHER=sccache ^
              -D CMAKE_C_COMPILER_LAUNCHER=sccache

      # ============================================
      # 11. Build
      #
      # /Z7 keeps debug info inside each .obj — for the autogenerated
      # qrc_*.cpp files (some run 80 000+ lines) cl.exe's per-process
      # address space (4 GB) gets uncomfortably close to full. With 4
      # parallel cl.exe instances on a 16 GB runner this overflowed in
      # f1f3183's build (C1060 "compiler is out of heap space"). Cap
      # parallelism at 2 so each cl.exe has ~8 GB headroom and the
      # huge qrc TUs compile cleanly.
      #
      # On rebuilds with a warm sccache the cap barely matters — most
      # TUs hit cache, only a handful actually compile.
      # ============================================
      - name: Build
        shell: cmd
        run: |
          cd %REPO_NAME%
          set _CL_=/Z7 %_CL_%
          cmake --build out --config Release --target Telegram --parallel 2
          if errorlevel 1 (
            sccache --show-stats || rem ignore if sccache absent
            exit /b 1
          )
          sccache --show-stats || rem ignore if sccache absent

      # ============================================
      # 12. Package
      # ============================================
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact

          # Find Telegram.exe wherever it ended up
          find $REPO_NAME/out -name "Telegram.exe" -exec cp {} artifact/ \;

          # Copy runtime DLLs if any
          find $REPO_NAME/out -name "*.dll" -exec cp {} artifact/ \; 2>/dev/null || true

          # Version file
          echo "${{ env.TDESKTOP_VERSION }}-accessible" > artifact/version.txt

          # Check we have the exe
          if [ ! -f artifact/Telegram.exe ]; then
            echo "ERROR: Telegram.exe not found!"
            find $REPO_NAME/out -type f -name "*.exe" | head -20
            exit 1
          fi

          echo "Telegram.exe found, size: $(du -h artifact/Telegram.exe | cut -f1)"

      # Bundle nvdaControllerClient64.dll alongside Telegram.exe. Without it
      # the user log shows the recursive scan of C:\Program Files\NVDA failing
      # to find the DLL — turns out many NVDA installs ship without the
      # controller-client component. With the DLL placed next to our .exe,
      # Windows finds it on LoadLibraryW("nvdaControllerClient64.dll") via
      # the default search order (process's own directory comes first), so
      # our existing nvda::Speak() implementation lights up automatically.
      - name: Bundle nvdaControllerClient.dll
        shell: bash
        run: |
          set -e
          # NVDA ships the controllerClient ZIP from their own CDN (not from
          # GitHub releases — those only contain the installer .exe). The
          # directory index at https://download.nvaccess.org/releases/stable/
          # lists `nvda_<VERSION>_controllerClient.zip` for the current
          # stable release. We scrape that name so we don't have to bump a
          # pinned URL on every NVDA release.
          BASE='https://download.nvaccess.org/releases/stable'
          ZIPNAME=$(curl -sL "$BASE/" \
            | grep -oE 'nvda_[0-9.]+_controllerClient\.zip' \
            | head -n 1)
          if [ -z "$ZIPNAME" ]; then
            echo "ERROR: couldn't find controllerClient zip in NVDA index"
            exit 1
          fi
          echo "Downloading $BASE/$ZIPNAME"
          curl -L --fail --silent --show-error -o cc.zip "$BASE/$ZIPNAME"
          mkdir -p cc-extract
          unzip -q cc.zip -d cc-extract
          # Modern NVDA layout: arch-specific subfolders with the same DLL
          # filename inside:
          #   x86/nvdaControllerClient.dll
          #   x64/nvdaControllerClient.dll
          #   arm64/nvdaControllerClient.dll
          #   arm64ec/nvdaControllerClient.dll
          # The legacy "nvdaControllerClient64.dll" naming is gone — that's
          # what broke the previous build (69917772958). Find the x64 one
          # specifically. As a fallback also accept the legacy filename in
          # case NVDA reverts.
          DLL=$(find cc-extract/x64 -iname 'nvdaControllerClient*.dll' \
                  2>/dev/null | head -n 1)
          if [ -z "$DLL" ]; then
            DLL=$(find cc-extract -ipath '*x64*nvdaControllerClient*.dll' \
                    | head -n 1)
          fi
          if [ -z "$DLL" ]; then
            echo "ERROR: x64 nvdaControllerClient DLL not found in archive"
            find cc-extract -type f -name '*.dll' | head -20
            exit 1
          fi
          # Copy with the modern name so the artifact matches the current
          # NVDA convention. Our keyboard.h tries both modern and legacy
          # filenames on LoadLibraryW.
          cp "$DLL" artifact/nvdaControllerClient.dll
          LIC=$(find cc-extract -iname 'license.txt' | head -n 1)
          if [ -n "$LIC" ]; then
            cp "$LIC" artifact/nvdaControllerClient-license.txt
          fi
          echo "Bundled $DLL -> artifact/nvdaControllerClient.dll"
          echo "Size: $(du -h artifact/nvdaControllerClient.dll | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Accessible-Win64
          path: artifact/
          retention-days: 90

      # ============================================
      # 12b. Build a Windows installer alongside the portable .exe so users
      #      can pick whichever they prefer in the Release. Uses Inno Setup
      #      (ships with windows-latest runners via chocolatey).
      # ============================================
      - name: Install Inno Setup
        shell: cmd
        run: choco install -y --no-progress innosetup

      - name: Build installer
        shell: cmd
        run: |
          mkdir installer
          echo [Setup] > setup.iss
          echo AppName=Telegram Desktop Accessible >> setup.iss
          echo AppId={{8A0B3A11-54B6-4D53-9C74-4D0B5E54A11A} >> setup.iss
          echo AppVersion=${{ env.TDESKTOP_VERSION }}-accessible >> setup.iss
          echo AppPublisher=tdesktop-accessible >> setup.iss
          echo AppPublisherURL=https://github.com/Nikita34196/tdesktop-accessible >> setup.iss
          echo AppUpdatesURL=https://github.com/Nikita34196/tdesktop-accessible/releases/latest >> setup.iss
          echo DefaultDirName={autopf}\TelegramAccessible >> setup.iss
          echo DefaultGroupName=Telegram Accessible >> setup.iss
          echo OutputDir=installer >> setup.iss
          echo OutputBaseFilename=Telegram-Accessible-Setup >> setup.iss
          echo Compression=lzma2 >> setup.iss
          echo SolidCompression=yes >> setup.iss
          echo ArchitecturesInstallIn64BitMode=x64 >> setup.iss
          echo ArchitecturesAllowed=x64 >> setup.iss
          echo PrivilegesRequired=lowest >> setup.iss
          echo PrivilegesRequiredOverridesAllowed=dialog >> setup.iss
          echo UninstallDisplayName=Telegram Desktop Accessible >> setup.iss
          echo. >> setup.iss
          echo [Files] >> setup.iss
          echo Source: "artifact\Telegram.exe"; DestDir: "{app}"; Flags: ignoreversion >> setup.iss
          echo Source: "artifact\nvdaControllerClient.dll"; DestDir: "{app}"; Flags: ignoreversion >> setup.iss
          echo Source: "artifact\*.dll"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist recursesubdirs >> setup.iss
          echo. >> setup.iss
          echo [Icons] >> setup.iss
          echo Name: "{group}\Telegram Accessible"; Filename: "{app}\Telegram.exe" >> setup.iss
          echo Name: "{group}\Uninstall Telegram Accessible"; Filename: "{uninstallexe}" >> setup.iss
          echo Name: "{autodesktop}\Telegram Accessible"; Filename: "{app}\Telegram.exe"; Tasks: desktopicon >> setup.iss
          echo. >> setup.iss
          echo [Tasks] >> setup.iss
          echo Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительно:"; Flags: unchecked >> setup.iss
          echo. >> setup.iss
          echo [Run] >> setup.iss
          echo Filename: "{app}\Telegram.exe"; Description: "Запустить Telegram Accessible"; Flags: nowait postinstall skipifsilent >> setup.iss
          type setup.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          dir installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Accessible-Setup
          path: installer/Telegram-Accessible-Setup.exe
          retention-days: 90

      - name: Verify release payload
        shell: bash
        run: |
          set -e
          for file in \
            artifact/Telegram.exe \
            artifact/nvdaControllerClient.dll \
            installer/Telegram-Accessible-Setup.exe
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: required release file is missing or empty: $file"
              exit 1
            fi
            echo "Release file ready: $file ($(du -h "$file" | cut -f1))"
          done

      # ============================================
      # 13. Create Release (on tag push only)
      # ============================================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/Telegram.exe
            artifact/nvdaControllerClient.dll
            installer/Telegram-Accessible-Setup.exe
          body: |
            ## Telegram Desktop Accessible ${{ github.ref_name }}

            Сборка на основе Telegram Desktop ${{ env.TDESKTOP_VERSION }}
            с поддержкой скринридеров (NVDA, JAWS, Narrator).

            ### Что выбрать
            - **`Telegram-Accessible-Setup.exe`** — установщик с ярлыками
              в меню «Пуск» и (опционально) на рабочем столе. Рекомендуется.
            - **`Telegram.exe` + `nvdaControllerClient.dll`** — портативный
              вариант. Скачайте оба файла в одну папку и запустите .exe.

            ### Горячие клавиши
            - **F6 / Shift+F6** — переключение между панелями
              (Чаты ↔ Сообщения ↔ Поле ввода)
            - **Стрелки вверх/вниз** — навигация по списку чатов и
              сообщениям (имя отправителя + текст/вложение)
            - **Tab / Shift+Tab** — ссылки и вложения в выбранном сообщении
            - **Enter** — открыть вложение или воспроизвести медиа
            - **Ctrl+Shift+R** — записать / отправить голосовое сообщение
            - **Ctrl+Shift+T** — тест озвучки NVDA
            - **Escape** — вернуться в список чатов
            - **Ctrl+Shift+F6** — диагностический дамп дерева виджетов
              (для отчётов о проблемах)

            > Собрано на базе tdesktop@${{ env.SHORT_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
