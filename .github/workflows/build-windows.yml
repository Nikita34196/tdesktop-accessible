# Build Telegram Desktop with Accessibility for Screen Readers
name: Windows Accessible Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    # softprops/action-gh-release needs write access on `contents` to create
    # the Release and upload Telegram.exe. The default GITHUB_TOKEN is
    # read-only for forks / private orgs unless we grant it explicitly,
    # which is why the v1.0.0 attempt failed with
    # "Resource not accessible by integration".
    permissions:
      contents: write

    env:
      REPO_NAME: tdesktop

    steps:
      # ============================================
      # 1. Checkout OUR repo (with accessibility files)
      # ============================================
      - name: Checkout accessibility repo
        uses: actions/checkout@v4
        with:
          path: accessibility-patch

      # ============================================
      # 2. Set up Visual Studio environment
      # ============================================
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================
      # 3. Install build tools
      # ============================================
      - name: Install tools
        run: |
          choco install --no-progress -y nasm yasm jom

      - name: Add tools to PATH
        shell: bash
        run: |
          echo "C:\ProgramData\chocolatey\lib\nasm\tools" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\yasm\tools" >> $GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\jom\tools" >> $GITHUB_PATH

      # ============================================
      # 4. Clone official Telegram Desktop
      # ============================================
      - name: Clone Telegram Desktop
        shell: bash
        run: |
          git clone --recursive https://github.com/telegramdesktop/tdesktop.git $REPO_NAME

      - name: Get repository info
        shell: bash
        run: |
          cd $REPO_NAME
          echo "TDESKTOP_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ============================================
      # 5. Copy accessibility files into source tree
      # ============================================
      - name: Install accessibility layer
        shell: bash
        run: |
          mkdir -p $REPO_NAME/Telegram/SourceFiles/ui/accessibility
          cp accessibility-patch/accessibility/*.h   $REPO_NAME/Telegram/SourceFiles/ui/accessibility/
          cp accessibility-patch/accessibility/*.cpp  $REPO_NAME/Telegram/SourceFiles/ui/accessibility/

      # ============================================
      # 6. Patch CMakeLists.txt
      # ============================================
      - name: Patch CMakeLists.txt
        shell: bash
        run: |
          CMAKEFILE="$REPO_NAME/Telegram/CMakeLists.txt"

          if ! grep -q "telegram_accessibility" "$CMAKEFILE"; then
            cat >> "$CMAKEFILE" << 'PATCH'

          # === Accessibility layer for screen readers (NVDA/JAWS/Narrator) ===
          target_sources(Telegram
          PRIVATE
              SourceFiles/ui/accessibility/telegram_accessibility.cpp
              SourceFiles/ui/accessibility/telegram_accessibility.h
              SourceFiles/ui/accessibility/telegram_accessibility_names.h
              SourceFiles/ui/accessibility/telegram_accessibility_keyboard.h
          )
          # === End accessibility layer ===
          PATCH
            echo "CMakeLists.txt patched successfully"
          else
            echo "CMakeLists.txt already patched"
          fi

      # ============================================
      # 7. Patch Application startup
      # ============================================
      - name: Patch Application init
        shell: python
        run: |
          import os, re, glob

          # Find application.cpp
          app_cpp = None
          for pattern in [
              'tdesktop/Telegram/SourceFiles/core/application.cpp',
              'tdesktop/Telegram/SourceFiles/application.cpp',
          ]:
              matches = glob.glob(pattern)
              if matches:
                  app_cpp = matches[0]
                  break

          if not app_cpp:
              # Search recursively
              for root, dirs, files in os.walk('tdesktop/Telegram/SourceFiles'):
                  for f in files:
                      if f == 'application.cpp' and 'core' in root:
                          app_cpp = os.path.join(root, f)
                          break
                  if app_cpp:
                      break

          if not app_cpp:
              print("WARNING: application.cpp not found!")
              exit(0)

          print(f"Found: {app_cpp}")

          with open(app_cpp, 'r', encoding='utf-8') as f:
              content = f.read()

          if 'TgAccessibility' in content:
              print('Already patched')
              exit(0)

          # Add include after the last #include
          include_block = (
              '\n// Accessibility for NVDA / screen readers\n'
              '#include "ui/accessibility/telegram_accessibility.h"\n'
              '#include "ui/accessibility/telegram_accessibility_names.h"\n'
          )

          includes = list(re.finditer(r'^#include\s+.*$', content, re.MULTILINE))
          if includes:
              pos = includes[-1].end()
              content = content[:pos] + include_block + content[pos:]

          # Find a good place to insert Install() call
          init_patterns = [
              r'(Application::run\s*\([^)]*\)\s*\{)',
              r'(Application::startMain\s*\([^)]*\)\s*\{)',
              r'(Application::start\s*\([^)]*\)\s*\{)',
              r'(Application::create\s*\([^)]*\)\s*\{)',
              r'(Application::launch\s*\([^)]*\)\s*\{)',
              r'(Application::init\s*\([^)]*\)\s*\{)',
          ]

          inserted = False
          for pattern in init_patterns:
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  insert_pos = match.end()
                  init_code = (
                      '\n    // Install screen reader accessibility layer\n'
                      '    TgAccessibility::Install();\n'
                  )
                  content = content[:insert_pos] + init_code + content[insert_pos:]
                  inserted = True
                  print(f'Inserted Install() into: {match.group(1)[:60]}')
                  break

          if not inserted:
              # Fallback: try to find any function body in Application class
              match = re.search(r'(Application::Application\s*\([^)]*\)\s*(?::[^{]*)?\{)', content, re.DOTALL)
              if match:
                  insert_pos = match.end()
                  init_code = (
                      '\n    // Install screen reader accessibility layer\n'
                      '    TgAccessibility::Install();\n'
                  )
                  content = content[:insert_pos] + init_code + content[insert_pos:]
                  inserted = True
                  print(f'Inserted Install() into constructor')

          if not inserted:
              print('WARNING: Could not find insertion point')
              print('Searching for any suitable function...')
              # Last resort: just add it and hope for the best
              match = re.search(r'void\s+Application::\w+\([^)]*\)\s*\{', content)
              if match:
                  insert_pos = match.end()
                  init_code = (
                      '\n    // Install screen reader accessibility layer\n'
                      '    TgAccessibility::Install();\n'
                  )
                  content = content[:insert_pos] + init_code + content[insert_pos:]
                  print(f'Inserted into: {match.group()[:60]}')

          with open(app_cpp, 'w', encoding='utf-8') as f:
              f.write(content)

          print('Patch complete')

      # ============================================
      # 7b. Patch HistoryInner so screen readers can see individual messages.
      #     Upstream Dialogs::InnerWidget already implements the
      #     accessibilityChild*() hooks defined on Ui::RpWidget; HistoryInner
      #     doesn't. We add the same set of overrides plus a tiny cache of
      #     visible messages so lib_ui's Accessible::Widget wraps each
      #     visible Element as a real QAccessibleInterface child.
      # ============================================
      - name: Patch HistoryInner for accessibility
        shell: python
        run: |
          import os, re

          h_path = 'tdesktop/Telegram/SourceFiles/history/history_inner_widget.h'
          cpp_path = 'tdesktop/Telegram/SourceFiles/history/history_inner_widget.cpp'

          for p in (h_path, cpp_path):
              if not os.path.exists(p):
                  print(f'WARNING: missing {p} — skipping HistoryInner patch')
                  exit(0)

          with open(h_path, 'r', encoding='utf-8') as f:
              h = f.read()

          # Upstream tdesktop (post-87ee04c, dev branch) added its own
          # accessibilityChildCount / Name / State / Role / Rect overrides
          # plus full keyPressEvent navigation tracking
          # _accessibilityFocusedItem / _accessibilityFocusedIndex. Our
          # patch would duplicate every definition (C2084 "function already
          # has a body" — exactly the build failure observed). Detect the
          # upstream override and bail out entirely; lib_ui's Init() + the
          # upstream a11y methods already do the same job our patch was
          # meant to provide.
          if 'accessibilityChildCount() const override' in h:
              print('HistoryInner already has upstream accessibility — '
                    'skipping our patch entirely')
              exit(0)

          if 'a11yRecomputeVisible' in h:
              print('history_inner_widget.h already patched')
          else:
              # Inject override declarations right after `~HistoryInner();`.
              h_methods = (
                  '\n\n\t// === Accessibility for screen readers (NVDA / JAWS) ===\n'
                  '\tQAccessible::Role accessibilityRole() override;\n'
                  '\tQt::FocusPolicy accessibilityFocusPolicy() override;\n'
                  '\tint accessibilityChildCount() const override;\n'
                  '\tQString accessibilityChildName(int index) const override;\n'
                  '\tQAccessible::State accessibilityChildState(int index) const override;\n'
                  '\tQAccessible::Role accessibilityChildRole() const override;\n'
                  '\tQRect accessibilityChildRect(int index) const override;\n'
              )
              h, n = re.subn(
                  r'(~HistoryInner\s*\(\s*\)\s*;)',
                  lambda m: m.group(1) + h_methods,
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: ~HistoryInner() landmark not found')
                  exit(1)

              # Inject the visible-items cache field as the last member of the
              # class. `_overlayHost;` is unique inside HistoryInner.
              h_field = (
                  '\n\n\t// Cache of currently visible messages, refreshed on every\n'
                  '\t// accessibilityChildCount() query. Used by the override block above.\n'
                  '\tstruct A11yVisibleItem {\n'
                  '\t\tHistoryView::Element *view = nullptr;\n'
                  '\t\tQRect rect;\n'
                  '\t};\n'
                  '\tmutable std::vector<A11yVisibleItem> _a11yVisibleItems;\n'
                  '\tvoid a11yRecomputeVisible();\n'
              )
              h, n = re.subn(
                  r'(std::unique_ptr<HistoryView::ElementOverlayHost>\s+_overlayHost\s*;)',
                  lambda m: m.group(1) + h_field,
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: _overlayHost landmark not found')
                  exit(1)

              with open(h_path, 'w', encoding='utf-8') as f:
                  f.write(h)
              print('history_inner_widget.h patched')

          with open(cpp_path, 'r', encoding='utf-8') as f:
              cpp = f.read()

          if 'a11yRecomputeVisible' in cpp:
              print('history_inner_widget.cpp already patched')
              exit(0)

          # Definitions go at the end of the file. They live in the same
          # translation unit as the `enumerateItems` template and its
          # `enumerateItemsInHistory` companion, so template instantiation
          # succeeds without exposing those templates in the header.
          impl = (
              '\n'
              '// === Accessibility implementations (added by accessibility-patch) ===\n'
              'void HistoryInner::a11yRecomputeVisible() {\n'
              '\t_a11yVisibleItems.clear();\n'
              '\tenumerateItems<EnumItemsDirection::TopToBottom>(\n'
              '\t\t[&](not_null<Element*> view, int itemtop, int itembottom) {\n'
              '\t\t\t_a11yVisibleItems.push_back({\n'
              '\t\t\t\tview.get(),\n'
              '\t\t\t\tQRect(0, itemtop, width(), itembottom - itemtop)\n'
              '\t\t\t});\n'
              '\t\t\treturn true;\n'
              '\t\t});\n'
              '}\n'
              '\n'
              'QAccessible::Role HistoryInner::accessibilityRole() {\n'
              '\treturn QAccessible::List;\n'
              '}\n'
              '\n'
              'Qt::FocusPolicy HistoryInner::accessibilityFocusPolicy() {\n'
              '\treturn Qt::TabFocus;\n'
              '}\n'
              '\n'
              'int HistoryInner::accessibilityChildCount() const {\n'
              '\tconst_cast<HistoryInner*>(this)->a11yRecomputeVisible();\n'
              '\treturn int(_a11yVisibleItems.size());\n'
              '}\n'
              '\n'
              'QString HistoryInner::accessibilityChildName(int index) const {\n'
              '\tif (index < 0 || index >= int(_a11yVisibleItems.size())) {\n'
              '\t\treturn QString();\n'
              '\t}\n'
              '\tconst auto view = _a11yVisibleItems[index].view;\n'
              '\tif (!view) {\n'
              '\t\treturn QString();\n'
              '\t}\n'
              '\treturn view->data()->notificationText().text;\n'
              '}\n'
              '\n'
              'QAccessible::State HistoryInner::accessibilityChildState(int index) const {\n'
              '\tauto state = QAccessible::State();\n'
              '\tstate.selectable = true;\n'
              '\tstate.focusable = true;\n'
              '\treturn state;\n'
              '}\n'
              '\n'
              'QAccessible::Role HistoryInner::accessibilityChildRole() const {\n'
              '\treturn QAccessible::ListItem;\n'
              '}\n'
              '\n'
              'QRect HistoryInner::accessibilityChildRect(int index) const {\n'
              '\tif (index < 0 || index >= int(_a11yVisibleItems.size())) {\n'
              '\t\treturn QRect();\n'
              '\t}\n'
              '\treturn _a11yVisibleItems[index].rect;\n'
              '}\n'
          )

          cpp = cpp.rstrip() + '\n' + impl
          with open(cpp_path, 'w', encoding='utf-8') as f:
              f.write(cpp)
          print('history_inner_widget.cpp patched')

      # ============================================
      # 7c. Make Up/Down arrows step through messages for screen readers.
      #     Mirrors what upstream Dialogs::InnerWidget already does for the
      #     chat list (processKeyDispatch -> selectSkip -> announceSelectedFocus
      #     -> accessibilityChildFocused(index)). HistoryInner's upstream
      #     keyPressEvent ignores arrows entirely (they go to
      #     _widget->tryProcessKeyInput); we intercept Up/Down/PageUp/PageDown/
      #     Home/End only when ScreenReaderModeActive() is true, so sighted
      #     users keep the original behavior.
      # ============================================
      - name: Patch HistoryInner for arrow-key a11y navigation
        shell: python
        run: |
          import os, re

          h_path = 'tdesktop/Telegram/SourceFiles/history/history_inner_widget.h'
          cpp_path = 'tdesktop/Telegram/SourceFiles/history/history_inner_widget.cpp'

          for p in (h_path, cpp_path):
              if not os.path.exists(p):
                  print(f'WARNING: missing {p} — skipping a11y key patch')
                  exit(0)

          # --- header: declare a11yProcessKey + _a11yCurrentIndex field ---
          with open(h_path, 'r', encoding='utf-8') as f:
              h = f.read()

          # Upstream tdesktop now ships its own keyPressEvent-driven
          # accessibility navigation (tracks _accessibilityFocusedItem +
          # _accessibilityFocusedIndex, calls accessibilityChildFocused on
          # arrow keys). Step 7b just bailed for the same reason; if
          # upstream's accessibilityChildCount override is present we
          # have nothing left to inject here either.
          if 'accessibilityChildCount() const override' in h:
              print('HistoryInner already has upstream a11y navigation — '
                    'skipping arrow-key patch')
              exit(0)

          if 'a11yProcessKey' in h:
              print('history_inner_widget.h already patched (a11y key)')
          else:
              # Append the method declaration right after the existing
              # a11yRecomputeVisible() declaration so it sits inside the
              # same private accessibility block.
              h, n = re.subn(
                  r'(void\s+a11yRecomputeVisible\s*\(\s*\)\s*;)',
                  lambda m: m.group(1) + '\n\tbool a11yProcessKey(QKeyEvent *e);\n',
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: a11yRecomputeVisible landmark not found')
                  exit(1)

              # Add the current-index field next to the visible-items cache.
              h, n = re.subn(
                  r'(mutable std::vector<A11yVisibleItem>\s+_a11yVisibleItems\s*;)',
                  lambda m: m.group(1) + '\n\tint _a11yCurrentIndex = -1;\n',
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: _a11yVisibleItems landmark not found')
                  exit(1)

              with open(h_path, 'w', encoding='utf-8') as f:
                  f.write(h)
              print('history_inner_widget.h patched (a11y key)')

          # --- cpp: inject call at top of keyPressEvent, update child state,
          #         and append the a11yProcessKey definition. ---
          with open(cpp_path, 'r', encoding='utf-8') as f:
              cpp = f.read()

          if 'a11yProcessKey' in cpp:
              print('history_inner_widget.cpp already patched (a11y key)')
              exit(0)

          # Add the screen-reader-mode include if it's not already present.
          # ScreenReaderModeActive() lives in ui/screen_reader_mode.h.
          if 'ui/screen_reader_mode.h' not in cpp:
              cpp, n = re.subn(
                  r'(#include\s+"ui/[^"]+"\s*\n)(?=(?:[^#]|#[^i]))',
                  lambda m: m.group(1) + '#include "ui/screen_reader_mode.h"\n',
                  cpp,
                  count=1)
              if n == 0:
                  # Fallback: just stick it after the first #include line.
                  cpp, n = re.subn(
                      r'(^#include\s+.*\n)',
                      lambda m: m.group(1) + '#include "ui/screen_reader_mode.h"\n',
                      cpp,
                      count=1,
                      flags=re.MULTILINE)
                  if n == 0:
                      print('ERROR: could not insert screen_reader_mode.h include')
                      exit(1)

          # Inject `if (a11yProcessKey(e)) return;` at the very top of
          # the existing HistoryInner::keyPressEvent body. The original
          # logic (Escape, Copy, Delete, tryProcessKeyInput, ...) stays
          # intact and runs whenever a11yProcessKey returns false.
          cpp, n = re.subn(
              r'(void\s+HistoryInner::keyPressEvent\s*\(\s*QKeyEvent\s*\*\s*e\s*\)\s*\{)',
              lambda m: m.group(1) + '\n\tif (a11yProcessKey(e)) return;',
              cpp,
              count=1)
          if n == 0:
              print('ERROR: HistoryInner::keyPressEvent landmark not found')
              exit(1)

          # Mark the currently-focused child in accessibilityChildState so
          # NVDA reports the correct active row when it queries state.
          cpp, n = re.subn(
              r'(QAccessible::State HistoryInner::accessibilityChildState\(int index\) const \{\n'
              r'\tauto state = QAccessible::State\(\);\n'
              r'\tstate\.selectable = true;\n'
              r'\tstate\.focusable = true;\n)',
              lambda m: m.group(1) + (
                  '\tif (index == _a11yCurrentIndex) {\n'
                  '\t\tstate.focused = true;\n'
                  '\t\tstate.selected = true;\n'
                  '\t\tstate.active = true;\n'
                  '\t}\n'),
              cpp,
              count=1)
          if n == 0:
              print('WARNING: accessibilityChildState landmark not found '
                    '— focused state will not be reported')

          # Append the a11yProcessKey definition. Lives in the same
          # translation unit as a11yRecomputeVisible() so the existing
          # enumerateItems template instantiations stay reusable.
          impl = (
              '\n'
              '// === Arrow-key a11y navigation (added by accessibility-patch) ===\n'
              'bool HistoryInner::a11yProcessKey(QKeyEvent *e) {\n'
              '\tif (!Ui::ScreenReaderModeActive()) {\n'
              '\t\treturn false;\n'
              '\t}\n'
              '\tconst auto key = e->key();\n'
              '\tconst auto isDown = (key == Qt::Key_Down);\n'
              '\tconst auto isUp = (key == Qt::Key_Up);\n'
              '\tconst auto isPageDown = (key == Qt::Key_PageDown);\n'
              '\tconst auto isPageUp = (key == Qt::Key_PageUp);\n'
              '\tconst auto isHome = (key == Qt::Key_Home);\n'
              '\tconst auto isEnd = (key == Qt::Key_End);\n'
              '\tif (!isDown && !isUp && !isPageDown && !isPageUp\n'
              '\t\t\t&& !isHome && !isEnd) {\n'
              '\t\treturn false;\n'
              '\t}\n'
              '\tif (e->modifiers()\n'
              '\t\t& (Qt::ControlModifier | Qt::AltModifier | Qt::MetaModifier)) {\n'
              '\t\treturn false;\n'
              '\t}\n'
              '\ta11yRecomputeVisible();\n'
              '\tconst int total = int(_a11yVisibleItems.size());\n'
              '\tif (total <= 0) return false;\n'
              '\tconst int prev = _a11yCurrentIndex;\n'
              '\tint next = prev;\n'
              '\tif (isHome) next = 0;\n'
              '\telse if (isEnd) next = total - 1;\n'
              '\telse if (isDown) next = (prev < 0) ? 0 : std::min(prev + 1, total - 1);\n'
              '\telse if (isUp) next = (prev < 0) ? (total - 1) : std::max(prev - 1, 0);\n'
              '\telse if (isPageDown) next = (prev < 0) ? 0 : std::min(prev + 5, total - 1);\n'
              '\telse if (isPageUp) next = (prev < 0) ? (total - 1) : std::max(prev - 5, 0);\n'
              '\t_a11yCurrentIndex = next;\n'
              '\tif (prev != next) {\n'
              '\t\taccessibilityChildFocused(next);\n'
              '\t}\n'
              '\treturn true;\n'
              '}\n'
          )

          cpp = cpp.rstrip() + '\n' + impl
          with open(cpp_path, 'w', encoding='utf-8') as f:
              f.write(cpp)
          print('history_inner_widget.cpp patched (a11y key)')

      # ============================================
      # 7d. Patch VoiceRecordBar for screen-reader voice recording.
      #     The voice button is fundamentally hold-to-record: it watches
      #     MouseButtonPress / Release with a 250 ms timer. A synthesized
      #     click (what lib_ui's accessibilityDoAction does for buttons)
      #     never starts the capture. We expose a Q_INVOKABLE method on
      #     VoiceRecordBar that drives the state machine directly, then
      #     bind it to Ctrl+Shift+R in our keyboard event filter.
      # ============================================
      - name: Patch VoiceRecordBar for accessibility
        shell: python
        run: |
          import os, re

          h_path = ('tdesktop/Telegram/SourceFiles/history/view/controls/'
                    'history_view_voice_record_bar.h')
          cpp_path = ('tdesktop/Telegram/SourceFiles/history/view/controls/'
                      'history_view_voice_record_bar.cpp')

          for p in (h_path, cpp_path):
              if not os.path.exists(p):
                  print(f'WARNING: missing {p} — skipping VoiceRecordBar patch')
                  exit(0)

          with open(h_path, 'r', encoding='utf-8') as f:
              h = f.read()

          if 'accessibilityToggleRecord' in h:
              print('voice_record_bar.h already patched')
          else:
              # Q_INVOKABLE needs its own Q_OBJECT in the class — the one in
              # Ui::RpWidget covers only base meta data. Inject right after
              # the opening brace of the class.
              h, n = re.subn(
                  r'(class\s+VoiceRecordBar\s+final\s*:\s*'
                  r'public\s+Ui::RpWidget\s*\{)',
                  lambda m: m.group(1) + '\n\tQ_OBJECT\n',
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: VoiceRecordBar class header landmark not found')
                  exit(1)

              # Add the Q_INVOKABLE declaration after startRecordingAndLock.
              decl = '\n\tQ_INVOKABLE void accessibilityToggleRecord();\n'
              h, n = re.subn(
                  r'(void\s+startRecordingAndLock\s*\([^)]*\)\s*;)',
                  lambda m: m.group(1) + decl,
                  h,
                  count=1)
              if n == 0:
                  print('ERROR: startRecordingAndLock landmark not found in h')
                  exit(1)

              with open(h_path, 'w', encoding='utf-8') as f:
                  f.write(h)
              print('voice_record_bar.h patched')

          with open(cpp_path, 'r', encoding='utf-8') as f:
              cpp = f.read()

          if 'accessibilityToggleRecord' in cpp:
              print('voice_record_bar.cpp already patched')
              exit(0)

          # State machine maps Ctrl+Shift+R (handled in our keyboard filter)
          # onto whatever the user would normally do by pressing, dragging
          # and releasing the send button:
          #   not recording  -> startRecordingAndLock(false): record & enter
          #                     locked mode (hands-free)
          #   recording      -> stop(true): finalize & send
          #   listening to a freshly recorded preview
          #                  -> requestToSendWithOptions({}): send it
          impl = (
              '\n'
              '// === Accessibility: single hotkey to start/send a voice ===\n'
              'void VoiceRecordBar::accessibilityToggleRecord() {\n'
              '\tif (isListenState()) {\n'
              '\t\trequestToSendWithOptions({});\n'
              '\t} else if (isActive()) {\n'
              '\t\tstop(true);\n'
              '\t} else {\n'
              '\t\tstartRecordingAndLock(false);\n'
              '\t}\n'
              '}\n'
          )

          # The whole file lives inside `namespace HistoryView::Controls { ... }`
          # — appending past the closing brace puts the impl in the global
          # namespace, where VoiceRecordBar isn't a name and none of its
          # private methods resolve. Insert just before the namespace close.
          cpp, n_impl = re.subn(
              r'(\n}\s*//\s*namespace\s+HistoryView::Controls\s*\n?)\Z',
              lambda m: '\n' + impl + m.group(1),
              cpp,
              count=1)
          if n_impl == 0:
              print('ERROR: namespace HistoryView::Controls close not found '
                    'at end of file')
              exit(1)

          with open(cpp_path, 'w', encoding='utf-8') as f:
              f.write(cpp)
          print('voice_record_bar.cpp patched')

      # ============================================
      # 7e. Patch lib_ui RpWidget::accessibilityChildFocused so NVDA actually
      #     announces the newly-focused list item.
      #
      #     Upstream fires a single `QAccessibleEvent(this, Focus)` with
      #     setChild(index). Through Qt's Windows MSAA bridge this becomes
      #     EVENT_OBJECT_FOCUS, but NVDA empirically only re-reads list-item
      #     selection when it also sees EVENT_OBJECT_SELECTION /
      #     EVENT_OBJECT_STATECHANGE on the child. Visible state in
      #     Dialogs::InnerWidget correctly flips selected/focused/active,
      #     but without those extra events NVDA never knows to query and
      #     speak the child — which exactly matches the reported symptom:
      #     "cursor moves through chats but NVDA stays silent, only the
      #     screen-review cursor reads them".
      # ============================================
      - name: Patch lib_ui RpWidget for NVDA child-focus events
        shell: python
        run: |
          import os, re

          cpp = 'tdesktop/Telegram/lib_ui/ui/rp_widget.cpp'
          if not os.path.exists(cpp):
              print(f'WARNING: missing {cpp} — skipping rp_widget patch')
              exit(0)

          with open(cpp, 'r', encoding='utf-8') as f:
              src = f.read()

          if 'a11y-extra-events' in src:
              print('rp_widget.cpp already patched')
              exit(0)

          # Match the original three-line body and replace with a richer
          # event burst plus diagnostic logging so we can confirm it ran.
          # Bails loud if upstream renames the function.
          replacement = (
              'void RpWidget::accessibilityChildFocused(int index) {\n'
              '\t// a11y-extra-events: fire Focus + Selection + StateChange\n'
              '\t// AND fire Focus directly on the child interface — the\n'
              '\t// MSAA bridge in Qt has been observed to drop child-id\n'
              '\t// focus events on lists where the parent keeps QWidget\n'
              '\t// focus. Diagnostic line appended to <Desktop>/\n'
              '\t// tg_a11y_diag.txt so we can confirm the call really fires.\n'
              '\t{\n'
              '\t\tstatic QFile diag;\n'
              '\t\tif (!diag.isOpen()) {\n'
              '\t\t\tconst auto dir = QStandardPaths::writableLocation(\n'
              '\t\t\t\tQStandardPaths::DesktopLocation);\n'
              '\t\t\tif (!dir.isEmpty()) {\n'
              '\t\t\t\tdiag.setFileName(\n'
              '\t\t\t\t\tdir + QStringLiteral("/tg_a11y_diag.txt"));\n'
              '\t\t\t\tdiag.open(QIODevice::Append | QIODevice::Text);\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\t\tif (diag.isOpen()) {\n'
              '\t\t\tQTextStream(&diag)\n'
              '\t\t\t\t<< "childFocused index=" << index\n'
              '\t\t\t\t<< " on " << metaObject()->className()\n'
              '\t\t\t\t<< " hasFocus=" << (hasFocus() ? 1 : 0)\n'
              '\t\t\t\t<< Qt::endl;\n'
              '\t\t\tdiag.flush();\n'
              '\t\t}\n'
              '\t}\n'
              '\n'
              '\tQAccessibleEvent focus(this, QAccessible::Focus);\n'
              '\tfocus.setChild(index);\n'
              '\tQAccessible::updateAccessibility(&focus);\n'
              '\n'
              '\tQAccessibleEvent selection(this, QAccessible::Selection);\n'
              '\tselection.setChild(index);\n'
              '\tQAccessible::updateAccessibility(&selection);\n'
              '\n'
              '\tauto changedState = QAccessible::State();\n'
              '\tchangedState.focused = true;\n'
              '\tchangedState.selected = true;\n'
              '\tchangedState.active = true;\n'
              '\tQAccessibleStateChangeEvent stateChange(this, changedState);\n'
              '\tstateChange.setChild(index);\n'
              '\tQAccessible::updateAccessibility(&stateChange);\n'
              '\n'
              '\t// Fire Focus directly on the child interface too — this is\n'
              '\t// how MSAA-aware screen readers find the focused descendant\n'
              '\t// when the host widget retains QWidget focus.\n'
              '\tif (auto child = accessibilityChildInterface(index)) {\n'
              '\t\tQAccessibleEvent childFocus(child, QAccessible::Focus);\n'
              '\t\tQAccessible::updateAccessibility(&childFocus);\n'
              '\t}\n'
              '}'
          )

          pattern = (
              r'void\s+RpWidget::accessibilityChildFocused\s*\(\s*int\s+index\s*\)'
              r'\s*\{[^}]*\}'
          )
          src2, n = re.subn(pattern, replacement, src, count=1)
          if n == 0:
              print('ERROR: accessibilityChildFocused body not found '
                    '(upstream lib_ui may have changed its shape)')
              exit(1)

          # The diagnostic block uses QFile/QStandardPaths/QTextStream; the
          # file already includes <QtGui/...> which doesn't pull these in
          # reliably across Qt versions. Inject explicit includes once.
          inc_block = (
              '#include <QtCore/QFile>\n'
              '#include <QtCore/QStandardPaths>\n'
              '#include <QtCore/QTextStream>\n'
          )
          if '<QtCore/QFile>' not in src2:
              src2, n_inc = re.subn(
                  r'(#include\s+"ui/rp_widget\.h"\s*\n)',
                  lambda m: m.group(1) + inc_block,
                  src2,
                  count=1)
              if n_inc == 0:
                  print('WARNING: own-header include not found; '
                        'prepending diagnostic includes')
                  src2 = inc_block + src2

          with open(cpp, 'w', encoding='utf-8') as f:
              f.write(src2)
          print('lib_ui rp_widget.cpp patched (extra a11y events)')

      # ============================================
      # 8. Cache third-party libraries
      # ============================================
      - name: Generate cache key
        shell: bash
        run: |
          PREPARE_FILE="$REPO_NAME/Telegram/build/prepare/prepare.py"
          if [ -f "$PREPARE_FILE" ]; then
            echo "CACHE_KEY=$(sha256sum $PREPARE_FILE | awk '{ print $1 }')" >> $GITHUB_ENV
          else
            echo "CACHE_KEY=no-prepare-file" >> $GITHUB_ENV
          fi

      - name: Restore libraries cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          # ThirdParty must be cached too: prepare.py installs the
          # bundled Python interpreter there (ThirdParty/python/Scripts/
          # python), and tdesktop/CMakeLists.txt hard-codes that path
          # as Python3_EXECUTABLE on Windows. Caching only Libraries
          # makes a cache hit skip prepare.py and then CMake fails to
          # find Python.
          path: |
            Libraries
            ThirdParty
          # v2 prefix busts the old Libraries-only cache.
          key: win-x64-libs-v2-${{ env.CACHE_KEY }}

      # ============================================
      # 9. Prepare libraries (if not cached)
      # ============================================
      - name: Prepare libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd %REPO_NAME%
          python Telegram\build\prepare\prepare.py

      # ============================================
      # 10. Configure
      # ============================================
      - name: Configure
        shell: cmd
        run: |
          cd %REPO_NAME%\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=${{ secrets.API_ID }} -D TDESKTOP_API_HASH=${{ secrets.API_HASH }}

      # ============================================
      # 11. Build
      # ============================================
      - name: Build
        shell: cmd
        run: |
          cd %REPO_NAME%
          cmake --build out --config Release --target Telegram --parallel

      # ============================================
      # 12. Package
      # ============================================
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact

          # Find Telegram.exe wherever it ended up
          find $REPO_NAME/out -name "Telegram.exe" -exec cp {} artifact/ \;

          # Copy runtime DLLs if any
          find $REPO_NAME/out -name "*.dll" -exec cp {} artifact/ \; 2>/dev/null || true

          # Version file
          echo "${{ env.TDESKTOP_VERSION }}-accessible" > artifact/version.txt

          # Check we have the exe
          if [ ! -f artifact/Telegram.exe ]; then
            echo "ERROR: Telegram.exe not found!"
            find $REPO_NAME/out -type f -name "*.exe" | head -20
            exit 1
          fi

          echo "Telegram.exe found, size: $(du -h artifact/Telegram.exe | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Accessible-Win64
          path: artifact/
          retention-days: 90

      # ============================================
      # 13. Create Release (on tag push only)
      # ============================================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/Telegram.exe
          body: |
            ## Telegram Desktop Accessible ${{ github.ref_name }}

            Сборка на основе Telegram Desktop ${{ env.TDESKTOP_VERSION }}
            с поддержкой скринридеров (NVDA, JAWS, Narrator).

            ### Установка
            1. Скачайте `Telegram.exe`
            2. Запустите
            3. Включите NVDA

            ### Горячие клавиши
            - **F6** — переключение между панелями
            - **Escape** — возврат в список чатов

            > Собрано на базе tdesktop@${{ env.SHORT_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
